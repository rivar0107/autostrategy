<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>策略工作台 - etf投资策略</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ===== Top Header ===== */
    .header { background: #001529; color: #fff; padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-size: 16px; font-weight: 600; }
    .strategy-title { font-size: 14px; color: rgba(255,255,255,0.85); }
    .header-right { display: flex; gap: 12px; }
    .header-btn { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 5px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .header-btn.primary { background: #1890ff; border-color: #1890ff; }
    .header-btn:hover { opacity: 0.85; }

    /* ===== Strategy Info Bar (fixed) ===== */
    .info-bar { background: #fff; padding: 12px 24px; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; gap: 28px; flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.06); z-index: 10; }
    .info-item { display: flex; align-items: center; gap: 8px; }
    .info-label { color: #999; font-size: 12px; }
    .info-value { font-weight: 500; font-size: 13px; }
    .status-tag { padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 500; }
    .status-backtested { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
    .status-running { background: #e6fffb; color: #13c2c2; border: 1px solid #87e8de; }
    .status-draft { background: #fff7e6; color: #fa8c16; border: 1px solid #ffd591; }
    .info-actions { margin-left: auto; display: flex; gap: 8px; }
    .mini-btn { padding: 4px 12px; font-size: 12px; border-radius: 4px; border: 1px solid #d9d9d9; background: #fff; cursor: pointer; }
    .mini-btn.primary { background: #1890ff; color: #fff; border-color: #1890ff; }
    .mini-btn.danger { color: #ff4d4f; border-color: #ff4d4f; }
    .mini-btn:hover { opacity: 0.8; }

    /* ===== Main Layout ===== */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ===== Left Sidebar - File Tree ===== */
    .sidebar { width: 240px; background: #fff; border-right: 1px solid #e8e8e8; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; font-weight: 600; font-size: 13px; color: #333; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header .actions { display: flex; gap: 4px; }
    .sidebar-header .actions button { background: none; border: none; cursor: pointer; color: #999; font-size: 14px; padding: 2px 4px; border-radius: 3px; }
    .sidebar-header .actions button:hover { color: #1890ff; background: #f0f0f0; }
    .file-tree { flex: 1; overflow-y: auto; padding: 6px 0; }
    .tree-folder { user-select: none; }
    .tree-folder-header { padding: 5px 10px 5px 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; font-weight: 500; }
    .tree-folder-header:hover { background: #f5f5f5; }
    .tree-folder-header .arrow { font-size: 10px; color: #999; transition: transform 0.15s; width: 12px; }
    .tree-folder.collapsed .arrow { transform: rotate(-90deg); }
    .tree-folder.collapsed .tree-children { display: none; }
    .tree-children { }
    .tree-file { padding: 5px 10px 5px 34px; cursor: pointer; display: flex; align-items: center; gap: 7px; font-size: 13px; color: #555; border-left: 2px solid transparent; }
    .tree-file:hover { background: #f5f5f5; }
    .tree-file.active { background: #e6f7ff; border-left-color: #1890ff; color: #1890ff; }
    .tree-file .icon { width: 14px; text-align: center; font-size: 12px; flex-shrink: 0; }
    .tree-file .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-file .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot.ok { background: #52c41a; }
    .dot.miss { background: #d9d9d9; }

    /* ===== Center - Tab Area ===== */
    .center { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f0f2f5; }
    .tab-bar { background: #fafafa; border-bottom: 1px solid #e8e8e8; display: flex; align-items: flex-end; padding: 0 8px; overflow-x: auto; flex-shrink: 0; }
    .tab { padding: 9px 16px; cursor: pointer; font-size: 13px; color: #666; border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; background: transparent; position: relative; top: 1px; }
    .tab:hover { color: #1890ff; }
    .tab.active { background: #fff; color: #1890ff; border-color: #e8e8e8; font-weight: 500; }
    .tab .close { font-size: 11px; color: #bbb; padding: 0 2px; border-radius: 3px; line-height: 1; }
    .tab .close:hover { color: #ff4d4f; background: #fff1f0; }
    .tab.pinned { color: #333; }
    .tab .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #13c2c2; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .tab-content { flex: 1; overflow-y: auto; padding: 20px; background: #fff; margin: 0; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* ===== Cards inside panes ===== */
    .card { background: #fff; border: 1px solid #f0f0f0; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .card-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .card-title-icon { width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
    .card-title-icon.blue { background: #e6f7ff; }
    .card-title-icon.green { background: #f6ffed; }
    .card-title-icon.orange { background: #fff7e6; }

    /* Steps */
    .steps { display: flex; gap: 0; margin: 8px 0 4px; }
    .step { flex: 1; text-align: center; padding: 10px 4px; font-size: 12px; color: #999; position: relative; }
    .step::before { content: ''; position: absolute; top: 18px; left: 0; right: 0; height: 2px; background: #f0f0f0; }
    .step:first-child::before { left: 50%; }
    .step:last-child::before { right: 50%; }
    .step .dot-circle { width: 28px; height: 28px; border-radius: 50%; background: #f0f0f0; color: #999; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; margin-bottom: 6px; position: relative; z-index: 1; }
    .step.done .dot-circle { background: #52c41a; color: #fff; }
    .step.done { color: #52c41a; }
    .step.current .dot-circle { background: #1890ff; color: #fff; }
    .step.current { color: #1890ff; font-weight: 500; }

    /* Metrics */
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .metric-card { background: #fafafa; border-radius: 8px; padding: 16px; text-align: center; }
    .metric-value { font-size: 22px; font-weight: 600; }
    .metric-value.positive { color: #52c41a; }
    .metric-value.negative { color: #ff4d4f; }
    .metric-label { font-size: 12px; color: #999; margin-top: 4px; }

    /* Code view */
    .code-view { background: #f6f8fa; border: 1px solid #e8e8e8; border-radius: 6px; font-family: 'SF Mono', Menlo, monospace; font-size: 13px; line-height: 1.7; overflow: auto; max-height: calc(100vh - 260px); }
    .code-line { display: flex; }
    .code-line:hover { background: #eef1f4; }
    .line-no { width: 48px; text-align: right; padding: 0 12px; color: #bbb; user-select: none; flex-shrink: 0; border-right: 1px solid #e8e8e8; }
    .line-text { padding: 0 16px; white-space: pre; }

    /* Log panel */
    .log-panel { background: #1e1e1e; color: #d4d4d4; padding: 14px 18px; border-radius: 6px; font-family: 'SF Mono', Menlo, monospace; font-size: 12px; line-height: 1.9; max-height: calc(100vh - 300px); overflow-y: auto; }
    .log-time { color: #666; }
    .log-info { color: #4ec9b0; }
    .log-warn { color: #dcdcaa; }
    .log-error { color: #f14c4c; }

    /* Empty */
    .empty { text-align: center; padding: 80px 20px; color: #999; }
    .empty-icon { font-size: 42px; margin-bottom: 12px; opacity: 0.35; }
    .empty-hint { font-size: 12px; color: #bbb; margin-top: 6px; }

    /* Buttons */
    .btn { padding: 6px 16px; border-radius: 4px; border: 1px solid #d9d9d9; background: #fff; cursor: pointer; font-size: 13px; }
    .btn.primary { background: #1890ff; color: #fff; border-color: #1890ff; }
    .btn.success { background: #52c41a; color: #fff; border-color: #52c41a; }
    .btn.danger { color: #ff4d4f; border-color: #ff4d4f; background: #fff; }
    .btn:hover { opacity: 0.85; }
    .action-bar { display: flex; gap: 10px; flex-wrap: wrap; }

    /* Responsive */
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- ===== Top Header ===== -->
  <header class="header">
    <div class="header-left">
      <span class="logo">autostrategy</span>
      <span style="color: rgba(255,255,255,0.4);">|</span>
      <span class="strategy-title">策略工作台 · etf投资策略</span>
    </div>
    <div class="header-right">
      <button class="header-btn">设置</button>
      <button class="header-btn primary">保存全部</button>
    </div>
  </header>

  <!-- ===== Strategy Info Bar (fixed top) ===== -->
  <div class="info-bar">
    <div class="info-item">
      <span class="info-label">状态</span>
      <span class="status-tag status-backtested">已回测</span>
    </div>
    <div class="info-item">
      <span class="info-label">市场</span>
      <span class="info-value">A股</span>
    </div>
    <div class="info-item">
      <span class="info-label">模板</span>
      <span class="info-value">无</span>
    </div>
    <div class="info-item">
      <span class="info-label">策略ID</span>
      <span class="info-value" style="font-family: monospace; color: #888;">etf投资策略</span>
    </div>
    <div class="info-actions">
      <button class="mini-btn primary">▶ 运行回测</button>
      <button class="mini-btn">● 启动模拟</button>
      <button class="mini-btn">🔄 重新生成代码</button>
    </div>
  </div>

  <!-- ===== Main Layout ===== -->
  <div class="main">

    <!-- ===== Left Sidebar: File Tree ===== -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>策略文件</span>
        <div class="actions">
          <button title="刷新">⟳</button>
        </div>
      </div>
      <div class="file-tree" id="fileTree"></div>
    </aside>

    <!-- ===== Center: Tab Area (fixed tabs + opened file tabs) ===== -->
    <div class="center">
      <div class="tab-bar" id="tabBar"></div>
      <div class="tab-content" id="tabContent"></div>
    </div>

  </div>

  <script>
    // ===== Mock data =====
    const FILE_TREE = [
      {
        name: 'etf投资策略', root: true, children: [
          { key: 'design', name: 'STRATEGY_DESIGN.md', icon: '📋', exists: true },
          { key: 'strategy_code', name: 'strategy.py', icon: '🐍', exists: true },
          { key: 'config', name: 'config.yaml', icon: '⚙️', exists: true },
          { key: 'readme', name: 'README.md', icon: '📖', exists: true },
          {
            name: 'backtest', children: [
              { key: 'backtest_result', name: 'results/backtest_result.json', icon: '📊', exists: true },
            ]
          },
          {
            name: 'paper_run', children: [
              { key: 'paper_run_result', name: 'results/paper_run_result.json', icon: '📈', exists: false },
              { key: 'paper_run_events', name: 'results/paper_run_events.jsonl', icon: '📑', exists: false },
              { key: 'paper_run_log', name: 'logs/paper_run.log', icon: '📝', exists: false },
            ]
          },
        ]
      }
    ];

    const FIXED_TABS = [
      { id: 'overview', label: '概览', pinned: true },
      { id: 'backtest', label: '回测结果', pinned: true },
      { id: 'paper', label: '模拟运行', pinned: true, live: true },
      { id: 'logs', label: '运行日志', pinned: true },
    ];

    const FILE_CONTENT = {
      strategy_code: `def run_backtest(config):
    """执行策略回测"""
    initial_cash = config.get("initial_cash", 1000000)
    # TODO: 实现完整的回测逻辑
    return {
        "initial_cash": initial_cash,
        "final_value": initial_cash,
        "max_drawdown": 0,
        "trade_count": 0,
    }`,
      design: `# ETF 投资策略设计文档\n\n## 策略思路\n基于A股ETF的趋势动量轮动，每周选取120日动量最强且处于上升趋势的ETF进行配置。\n\n## 买入规则\n- 买入排名前2名，每只45%仓位\n- 动量跌出前4名或触发止损时卖出\n\n## 风控\n- 组合最大回撤控制在15%以内`,
      config: `initial_cash: 1000000\nstart_date: "2024-01-01"\nend_date: "2024-12-31"\ncommission: 0.0003\nslippage: 0.001\nmarket: A股`,
      readme: `# etf投资策略\n\n本策略基于A股ETF的趋势动量轮动。`,
      backtest_result: `{\n  "score": 80,\n  "backtest": {\n    "annual_return": 12.5,\n    "max_drawdown": -5.2,\n    "sharpe": 1.8,\n    "trade_count": 24\n  }\n}`,
      paper_run_result: `{\n  "run_status": "pending"\n}`,
      paper_run_events: '',
      paper_run_log: '[12:15:32] [INFO] 策略已加载\n[12:15:33] [INFO] 配置文件验证通过',
    };

    // ===== State =====
    let openTabs = [...FIXED_TABS.map(t => t.id)]; // fixed tabs always open
    let fileTabs = []; // dynamically opened file tabs
    let activeTab = 'overview';
    let activeFile = null;

    // ===== Render file tree =====
    function renderTree() {
      const container = document.getElementById('fileTree');
      container.innerHTML = '';
      FILE_TREE[0].children.forEach(node => {
        container.appendChild(renderNode(node));
      });
    }

    function renderNode(node) {
      if (node.children) {
        const folder = document.createElement('div');
        folder.className = 'tree-folder';
        folder.innerHTML = `
          <div class="tree-folder-header" onclick="this.parentElement.classList.toggle('collapsed')">
            <span class="arrow">▼</span>
            <span>📁 ${node.name}</span>
          </div>
          <div class="tree-children"></div>
        `;
        const children = folder.querySelector('.tree-children');
        node.children.forEach(child => children.appendChild(renderNode(child)));
        return folder;
      }
      const file = document.createElement('div');
      file.className = 'tree-file' + (activeFile === node.key ? ' active' : '');
      file.dataset.key = node.key;
      file.innerHTML = `
        <span class="icon">${node.icon}</span>
        <span class="name">${node.name}</span>
        <span class="dot ${node.exists ? 'ok' : 'miss'}"></span>
      `;
      file.onclick = () => openFileTab(node);
      return file;
    }

    // ===== Open a file as a tab (Codex-style) =====
    function openFileTab(node) {
      activeFile = node.key;
      if (!fileTabs.find(t => t.id === node.key)) {
        fileTabs.push({ id: node.key, label: node.name, isFile: true });
      }
      activeTab = node.key;
      renderTree();
      renderTabs();
      renderContent();
    }

    function closeFileTab(id, event) {
      event.stopPropagation();
      fileTabs = fileTabs.filter(t => t.id !== id);
      if (activeTab === id) {
        activeTab = 'overview';
        activeFile = null;
      }
      renderTree();
      renderTabs();
      renderContent();
    }

    // ===== Render tab bar =====
    function renderTabs() {
      const bar = document.getElementById('tabBar');
      bar.innerHTML = '';
      // fixed tabs
      FIXED_TABS.forEach(t => {
        const el = document.createElement('div');
        el.className = 'tab pinned' + (activeTab === t.id ? ' active' : '');
        el.innerHTML = `${t.label}${t.live ? '<span class="live-dot"></span>' : ''}`;
        el.onclick = () => { activeTab = t.id; activeFile = null; renderTree(); renderTabs(); renderContent(); };
        bar.appendChild(el);
      });
      // file tabs
      fileTabs.forEach(t => {
        const el = document.createElement('div');
        el.className = 'tab' + (activeTab === t.id ? ' active' : '');
        el.innerHTML = `${t.label}<span class="close" onclick="closeFileTab('${t.id}', event)">×</span>`;
        el.onclick = () => { activeTab = t.id; activeFile = t.id; renderTree(); renderTabs(); renderContent(); };
        bar.appendChild(el);
      });
    }

    // ===== Render content =====
    function renderContent() {
      const container = document.getElementById('tabContent');
      if (activeFile) {
        container.innerHTML = renderFilePane(activeFile);
        return;
      }
      switch (activeTab) {
        case 'overview': container.innerHTML = overviewPane(); break;
        case 'backtest': container.innerHTML = backtestPane(); break;
        case 'paper': container.innerHTML = paperPane(); break;
        case 'logs': container.innerHTML = logsPane(); break;
      }
    }

    function renderFilePane(key) {
      const content = FILE_CONTENT[key] || '';
      const lines = content.split('\n');
      const codeHtml = lines.map((line, i) =>
        `<div class="code-line"><span class="line-no">${i + 1}</span><span class="line-text">${escapeHtml(line) || ' '}</span></div>`
      ).join('');
      const names = {
        design: 'STRATEGY_DESIGN.md', strategy_code: 'strategy.py', config: 'config.yaml',
        readme: 'README.md', backtest_result: 'backtest_result.json',
        paper_run_result: 'paper_run_result.json', paper_run_events: 'paper_run_events.jsonl', paper_run_log: 'paper_run.log',
      };
      return `
        <div class="card">
          <div class="card-title">
            <span class="card-title-icon blue">📄</span>
            ${names[key] || key}
          </div>
          ${content ? `<div class="code-view">${codeHtml}</div>` : `<div class="empty"><div class="empty-icon">📄</div><div>文件尚未生成</div><div class="empty-hint">运行对应流程后自动生成</div></div>`}
        </div>
      `;
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function overviewPane() {
      return `
        <div class="card">
          <div class="card-title"><span class="card-title-icon blue">⚡</span>工作流进度</div>
          <div class="steps">
            <div class="step done"><span class="dot-circle">✓</span><br>创建策略</div>
            <div class="step done"><span class="dot-circle">✓</span><br>设计文档</div>
            <div class="step done"><span class="dot-circle">✓</span><br>生成代码</div>
            <div class="step done"><span class="dot-circle">✓</span><br>回测验证</div>
            <div class="step current"><span class="dot-circle">5</span><br>模拟运行</div>
            <div class="step"><span class="dot-circle">6</span><br>实盘部署</div>
          </div>
        </div>
        <div class="card">
          <div class="card-title"><span class="card-title-icon blue">⚡</span>快速操作</div>
          <div class="action-bar">
            <button class="btn primary">▶ 运行回测</button>
            <button class="btn success">● 启动模拟运行</button>
            <button class="btn">🔄 重新生成代码</button>
            <button class="btn danger">■ 停止模拟</button>
          </div>
        </div>
        <div class="card">
          <div class="card-title"><span class="card-title-icon green">📈</span>核心指标</div>
          <div class="metrics-grid">
            <div class="metric-card"><div class="metric-value positive">+12.5%</div><div class="metric-label">总收益率</div></div>
            <div class="metric-card"><div class="metric-value">1.8</div><div class="metric-label">夏普比率</div></div>
            <div class="metric-card"><div class="metric-value negative">-5.2%</div><div class="metric-label">最大回撤</div></div>
            <div class="metric-card"><div class="metric-value">24</div><div class="metric-label">交易次数</div></div>
          </div>
        </div>
        <div class="card">
          <div class="card-title"><span class="card-title-icon orange">📋</span>策略摘要</div>
          <p style="line-height: 1.8; color: #666; font-size: 14px;">
            本策略基于A股ETF的趋势动量轮动，每周选取120日动量最强且处于上升趋势的ETF进行配置。
            买入排名前2名，每只45%仓位；动量跌出前4名或触发止损时卖出。组合最大回撤控制在15%以内。
          </p>
        </div>
      `;
    }

    function backtestPane() {
      return `
        <div class="card">
          <div class="card-title"><span class="card-title-icon green">📊</span>回测摘要</div>
          <div class="metrics-grid">
            <div class="metric-card"><div class="metric-value">80</div><div class="metric-label">评分</div></div>
            <div class="metric-card"><div class="metric-value positive">+12.5%</div><div class="metric-label">年化收益</div></div>
            <div class="metric-card"><div class="metric-value negative">-5.2%</div><div class="metric-label">最大回撤</div></div>
            <div class="metric-card"><div class="metric-value">1.8</div><div class="metric-label">夏普比率</div></div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">详细结果</div>
          <div class="code-view">${escapeHtml(FILE_CONTENT.backtest_result).split('\n').map((l, i) => `<div class="code-line"><span class="line-no">${i + 1}</span><span class="line-text">${l || ' '}</span></div>`).join('')}</div>
        </div>
      `;
    }

    function paperPane() {
      return `
        <div class="card">
          <div class="card-title">
            <span class="card-title-icon green">●</span>模拟运行状态
            <span class="status-tag status-running" style="margin-left: auto;">LIVE</span>
          </div>
          <div class="metrics-grid">
            <div class="metric-card"><div class="metric-value">¥1,000,000</div><div class="metric-label">初始资金</div></div>
            <div class="metric-card"><div class="metric-value">¥1,010,000</div><div class="metric-label">当前市值</div></div>
            <div class="metric-card"><div class="metric-value positive">+1.0%</div><div class="metric-label">模拟收益</div></div>
            <div class="metric-card"><div class="metric-value">1</div><div class="metric-label">交易次数</div></div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">最近交易信号</div>
          <div style="color: #999; text-align: center; padding: 32px;">暂无交易信号</div>
        </div>
      `;
    }

    function logsPane() {
      return `
        <div class="card">
          <div class="card-title"><span class="card-title-icon orange">📝</span>运行日志</div>
          <div class="log-panel">
            <div><span class="log-time">[12:15:32]</span> <span class="log-info">[INFO]</span> 策略 etf投资策略 已加载</div>
            <div><span class="log-time">[12:15:33]</span> <span class="log-info">[INFO]</span> 配置文件验证通过</div>
            <div><span class="log-time">[12:15:35]</span> <span class="log-warn">[WARN]</span> 回测结果文件不存在，跳过加载</div>
            <div><span class="log-time">[12:15:36]</span> <span class="log-info">[INFO]</span> 回测任务完成，评分 80</div>
            <div><span class="log-time">[12:15:40]</span> <span class="log-info">[INFO]</span> 等待下一步操作...</div>
          </div>
        </div>
      `;
    }

    // ===== Init =====
    renderTree();
    renderTabs();
    renderContent();
  </script>
</body>
</html>
